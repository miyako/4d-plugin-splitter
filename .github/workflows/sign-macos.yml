name: Merge platforms, sign and notarize the plug-in bundle

on:
  workflow_call:
    outputs:
      signed:
        description: Whether signing and notarization succeeded
        value: ${{ jobs.sign.outputs.signed }}
    secrets:
      APPLE_DEVELOPER_ID_CERTIFICATE:
        required: true
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      NOTARYTOOL_APPLE_ID:
        required: true
      NOTARYTOOL_PASSWORD:
        required: true
      NOTARYTOOL_TEAM_ID:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  sign:
    if: github.repository == 'miyako/4d-plugin-splitter' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate this trusted Build run before downloading
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p build/macos-signing/evidence
          gh api "repos/miyako/4d-plugin-splitter/actions/runs/$SOURCE_RUN_ID" \
            > build/macos-signing/evidence/native-run.json
          gh api repos/miyako/4d-plugin-splitter/actions/workflows/build.yml \
            > build/macos-signing/evidence/native-workflow.json
          bash scripts/sign_macos.sh validate-run
      - name: Download only the validated universal artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-universal
          path: build/macos-signing/incoming
      - name: Download the validated Windows x64 artifact to merge into the bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64
          path: build/macos-signing/incoming-windows
      - name: Verify unsigned packages, merge Windows x64 into the universal bundle
        run: bash scripts/sign_macos.sh prepare
      - name: Sign and notarize (all six secrets required)
        id: signing
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: bash scripts/sign_macos.sh sign
      - name: Always remove signing credentials
        if: always()
        run: bash scripts/sign_macos.sh cleanup
      - name: Upload verified signed deliverables for the release job
        if: success() && steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Splitter-macos-signed-${{ github.run_id }}
          path: build/macos-signing/output/*
          if-no-files-found: error
      - name: Upload nonsecret provenance and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Splitter-macos-signing-evidence-${{ github.run_id }}
          path: build/macos-signing/evidence/
          if-no-files-found: warn
