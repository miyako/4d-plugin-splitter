name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-version-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an explicit dispatch from main
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Version bumps must be dispatched from main."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Bump version and commit to main
        id: bump
        env:
          MODE: ${{ inputs.mode }}
        run: python3 scripts/bump_version.py "$MODE"
      - name: Summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          {
            echo "### Bumped version to $VERSION"
            echo "Manually run **Build** from **main** at the new commit."
            echo "Build runs native checks, signs/notarizes macOS, then tags and publishes the release only after verification succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
