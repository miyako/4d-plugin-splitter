name: Native build and real host checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  macos-universal:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/_deps/fourd_sdk-subbuild/fourd_sdk-populate-prefix/src/archive.tar
            build/_deps/splitter_icu-subbuild/splitter_icu-populate-prefix/src/icu4c-79.1-sources.tgz
          key: sources-macos-${{ hashFiles('dependencies.lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/host-archives
          key: hosts-arm64-${{ hashFiles('tests/tool4d.lock.json') }}
      - name: Require native arm64 builder
        run: test "$(uname -m)" = arm64
      - name: Build universal plug-in and native tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python -m unittest discover -s tests/python -v
      - name: Restore pinned arm64 host
        run: python scripts/fetch_host.py --platform macos-arm64 --destination build/host --cache-dir build/host-archives
      - name: Package and verify source/compiled host execution
        run: |
          python scripts/package.py --build-dir build --output build/Splitter-macos-universal.zip
          python scripts/unpack.py build/Splitter-macos-universal.zip build/unpacked
          python scripts/test_m1.py \
            --tool4d build/host/tool4d.app/Contents/MacOS/tool4d \
            --plugin build/unpacked/Splitter.bundle --report build/host-arm64.json
          tar -czf build/native-test-runner.tar.gz -C build splitter_native_tests \
            -C plugins/Splitter.bundle/Contents/Resources/licenses ICU-LICENSE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-universal
          if-no-files-found: error
          path: |
            build/Splitter-macos-universal.zip
            build/native-test-runner.tar.gz
            build/host-arm64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: macos-arm64-failure-evidence
          path: |
            build/Testing/Temporary/
            build/host-*.json

  macos-preemptive:
    needs: macos-universal
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/host-archives
          key: hosts-arm64-21-${{ hashFiles('tests/tool4d.lock.json') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-universal
          path: build/incoming
      - name: Verify the same universal package on the newer host
        run: |
          test "$(uname -m)" = arm64
          python scripts/unpack.py build/incoming/Splitter-macos-universal.zip build/unpacked
          python scripts/fetch_host.py --platform macos-arm64-21.1 --destination build/host-21 --cache-dir build/host-archives
          python scripts/test_m1.py --tool4d build/host-21/tool4d.app/Contents/MacOS/tool4d \
            --plugin build/unpacked/Splitter.bundle --preemptive --report build/host-arm64-21.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-preemptive-evidence
          if-no-files-found: error
          path: build/host-arm64-21.json

  macos-intel:
    needs: macos-universal
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/_deps/fourd_sdk-subbuild/fourd_sdk-populate-prefix/src/archive.tar
            build/_deps/splitter_icu-subbuild/splitter_icu-populate-prefix/src/icu4c-79.1-sources.tgz
          key: sources-macos-${{ hashFiles('dependencies.lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/host-archives
          key: hosts-intel-${{ hashFiles('tests/tool4d.lock.json') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-universal
          path: build/incoming
      - name: Require native Intel host and verify the same universal package
        run: |
          test "$(uname -m)" = x86_64
          python scripts/unpack.py build/incoming/Splitter-macos-universal.zip build/unpacked
          mkdir -p build/native
          tar -xzf build/incoming/native-test-runner.tar.gz -C build/native
          build/native/splitter_native_tests build/unpacked/Splitter.bundle/Contents/Resources/icudt79l.dat
      - name: Build and test independently with the native Intel toolchain
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Restore pinned Intel host and run source/compiled checks
        run: |
          python scripts/fetch_host.py --platform macos-x86_64 --destination build/host --cache-dir build/host-archives
          python scripts/test_m1.py \
            --tool4d build/host/tool4d.app/Contents/MacOS/tool4d \
            --plugin build/unpacked/Splitter.bundle --report build/host-x86_64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-intel-evidence
          if-no-files-found: error
          path: build/host-x86_64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: macos-intel-failure-evidence
          path: |
            build/Testing/Temporary/
            build/host-*.json

  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/_deps/fourd_sdk-subbuild/fourd_sdk-populate-prefix/src/archive.tar
            build/_deps/splitter_icu-subbuild/splitter_icu-populate-prefix/src/icu4c-79.1-sources.tgz
          key: sources-windows-${{ hashFiles('dependencies.lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/host-archives
          key: hosts-windows-${{ hashFiles('tests/tool4d.lock.json') }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Build native x64 plug-in and tests
        run: |
          cmake -S . -B build -A x64 -DCMAKE_CONFIGURATION_TYPES=Release
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure
          python -m unittest discover -s tests/python -v
      - name: Restore pinned Windows host
        run: python scripts/fetch_host.py --platform windows-x64 --destination build/host --cache-dir build/host-archives
      - name: Package and verify source/compiled host execution
        run: |
          python scripts/package.py --build-dir build --output build/Splitter-windows-x64.zip
          python scripts/unpack.py build/Splitter-windows-x64.zip build/unpacked
          python scripts/test_m1.py --tool4d build/host/tool4d/tool4d.exe --plugin build/unpacked/Splitter.bundle --report build/host-windows-x64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            build/Splitter-windows-x64.zip
            build/host-windows-x64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: windows-failure-evidence
          path: |
            build/Testing/Temporary/
            build/host-*.json
